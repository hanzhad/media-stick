# Route ALSA default PCM and CTL through PipeWire so Kodi, AirPlay (UxPlay), Miracast,
# and Chromium web apps share HDMI audio without exclusive-HDMI lockouts, and volume
# works everywhere.
# Direct hardware fallback (when PipeWire is bypassed): sysdefault:CARD=vc4hdmi
pcm.!default "pipewire"
ctl.!default "pipewire"
