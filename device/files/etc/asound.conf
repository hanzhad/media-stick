# Sound goes to the TV over HDMI. Left alone, ALSA's default is card 0, the 3.5 mm jack
# (bcm2835 Headphones), so Kodi, AirPlay (UxPlay) and the web apps played into a jack nobody
# listens to. sysdefault:CARD=vc4hdmi is the HDMI card's own default
# (/usr/share/alsa/cards/vc4-hdmi.conf): it converts to the IEC958 frames the port needs and
# adds a software volume. By name, not number: card numbers follow probe order.
# (defaults.pcm.card takes a number only; a name there breaks every ALSA program.)
pcm.!default "sysdefault:CARD=vc4hdmi"
ctl.!default "sysdefault:CARD=vc4hdmi"
