# Kodi screenshots for screen-view live in RAM, not on the SD card.
d /run/media-stick       0755 media media -
d /run/media-stick/shots 0775 media media -
# Sign-in codes the Kodi add-ons publish for the TV screen and the phone page; kodi and panel both run as media.
d /run/media-stick/signin 0755 media media -
# Bing wallpapers for the Kodi home screen and their blurred copies for the settings
# backgrounds (both made by media-stick-wallpapers).
d /var/cache/media-stick            0755 root  root  -
d /var/cache/media-stick/wallpapers 0755 media media -
d /var/cache/media-stick/wallpapers-blur 0755 media media -
