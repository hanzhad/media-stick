# Kodi screenshots for screen-view live in RAM, not on the SD card.
d /run/media-stick       1775 root  media -
z /run/media-stick       1775 root  media -
d /run/media-stick/shots 0775 media media -
z /run/media-stick/shots 0775 media media -
# Sign-in codes the Kodi add-ons publish for the TV screen and the phone page; kodi and panel both run as media.
d /run/media-stick/signin 0755 media media -
z /run/media-stick/signin 0755 media media -
# Transient playback resume and shared page cache in RAM (tmpfs).
d /run/media-stick/resume 0755 media media -
z /run/media-stick/resume 0755 media media -
d /run/media-stick/page-cache 0755 media media -
z /run/media-stick/page-cache 0755 media media -
# Chromium HTTP disk cache in /tmp so streaming web apps do not wear microSD.
d /tmp/chromium-cache 0755 media media -
z /tmp/chromium-cache 0755 media media -
# Bing wallpapers for the Kodi home screen and their blurred copies for the settings
# backgrounds (both made by media-stick-wallpapers).
d /var/cache/media-stick            1775 root  media -
z /var/cache/media-stick            1775 root  media -
d /var/cache/media-stick/wallpapers 0755 media media -
d /var/cache/media-stick/wallpapers-blur 0755 media media -
# Choices of the owner that outlive a reboot (prefs/language: code; prefs/max-quality: 720p | 1080p | unlimited).
d /var/lib/media-stick       1775 root  media -
z /var/lib/media-stick       1775 root  media -
d /var/lib/media-stick/prefs 0755 media media -
# Where the person stopped and SWEET.TV local favourites (mediastick_resume): the Kodi service/app writes, Kodi and the panel read.
d /var/lib/media-stick/resume 0755 media media -
