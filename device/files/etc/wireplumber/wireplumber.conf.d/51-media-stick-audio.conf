# Pin vc4-hdmi above bcm2835 Headphones, default 100% sink volume, and tune analog ALSA headroom on Pi 3B+.
wireplumber.settings = {
  "device.routes.default-sink-volume" = 1.0
}

monitor.alsa.rules = [
  {
    matches = [
      {
        "node.name" = "~alsa_output.*hdmi*"
      }
    ]
    actions = {
      update-props = {
        "priority.driver" = 2000
        "priority.session" = 2000
      }
    }
  }
  {
    matches = [
      {
        "node.name" = "~alsa_output.*mailbox*|~alsa_output.*headphones*"
      }
    ]
    actions = {
      update-props = {
        "priority.driver" = 900
        "priority.session" = 900
        "api.alsa.period-size" = 1024
        "api.alsa.headroom" = 1024
      }
    }
  }
]
