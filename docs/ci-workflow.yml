name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lint and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck libxml2-utils python3-pil python3-numpy jq fonts-roboto-unhinted
      - name: Run lint and offline tests
        run: make check
